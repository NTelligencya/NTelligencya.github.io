<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>ntworld.ink</title>
  <!-- The site mark, matching .brand-mark in styles.css: two rounded squares,
       one rotated 45 degrees. Strokes are a little heavier than the CSS so the
       shape survives at 16 pixels. -->
  <rect x="4.5" y="4.5" width="23" height="23" rx="4"
        fill="none" stroke="#1ac9c9" stroke-width="2"/>
  <rect x="4.5" y="4.5" width="23" height="23" rx="4"
        fill="none" stroke="#4ddcdc" stroke-width="2" opacity="0.5"
        transform="rotate(45 16 16)"/>
</svg>
