<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PowerShell Syntax Crammer — an interactive trainer that drills PowerShell syntax in three passes: learn, copy, recall.">
<title>PowerShell Syntax Crammer</title>
<style>
  :root {
    /* THEME TOKENS — replaced per subject. Defaults = PowerShell blue. */
    --bg: #012456;
    --bg-deep: #001737;
    --panel: #0a2f6b;
    --ink: #e8eefc;
    --dim: #8fa8d8;
    --caret: #ffe873;
    --ok: #56d364;
    --bad: #ff7b72;
    --accent: #58c4ff;
    --rule: rgba(143,168,216,0.22);
    --mono: "Cascadia Code", "Consolas", ui-monospace, Menlo, monospace;
    --sigil-text: "PS C:\\> ";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #06398a 0%, #012456 45%, #001737 100%);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px; line-height: 1.5;
    min-height: 100%; display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 820px; padding: 22px 18px 80px; }
  .titlebar {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    background: var(--bg-deep); border: 1px solid var(--rule); border-bottom: none; border-radius: 8px 8px 0 0;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .titlebar .name { margin-left: 6px; color: var(--dim); font-size: 12.5px; letter-spacing: 0.04em; }
  .tbnav { margin-left: auto; background: none; border: 1px solid var(--rule); font-size: 11.5px; padding: 3px 10px; color: var(--dim); border-radius: 4px; }
  .tbnav:hover { color: var(--ink); }
  .console {
    background: rgba(0,0,0,0.30); border: 1px solid var(--rule); border-radius: 0 0 8px 8px;
    padding: 22px 22px 26px; min-height: 320px; backdrop-filter: blur(2px);
  }
  .stripwrap { margin: 18px 2px 0; }
  .stripmeta { display: flex; justify-content: space-between; align-items: baseline; color: var(--dim); font-size: 12px; margin-bottom: 6px; letter-spacing: 0.03em; }
  .strip { height: 6px; width: 100%; background: rgba(127,127,127,0.18); border-radius: 4px; overflow: hidden; }
  .strip > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .35s ease; }
  .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .eyebrow .pill { border: 1px solid var(--rule); border-radius: 999px; padding: 2px 9px; color: var(--dim); letter-spacing: 0.06em; font-size: 11px; }
  .eyebrow .pill.topic { text-transform: none; }
  .desc { font-size: 16px; line-height: 1.55; margin: 0 0 4px; color: var(--ink); }
  .syntaxbox { margin: 18px 0 6px; padding: 16px 18px; background: rgba(0,0,0,0.34); border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 4px; font-size: 17px; color: var(--ink); overflow-x: auto; white-space: pre; }
  .label { color: var(--dim); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .note { color: var(--dim); font-size: 13px; margin-top: 14px; }
  .note b { color: var(--ink); font-weight: 600; }
  .alias { color: var(--caret); }
  .promptline { margin-top: 22px; }
  .ps { display: flex; align-items: center; gap: 0; background: rgba(0,0,0,0.34); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; font-size: 16.5px; }
  .ps .sigil { color: var(--ok); white-space: nowrap; user-select: none; }
  .ps .sigil::after { content: var(--sigil-text); }
  .ps input { flex: 1; background: transparent; border: none; outline: none; color: var(--ink); font-family: var(--mono); font-size: 16.5px; padding: 0 0 0 8px; caret-color: var(--caret); min-width: 0; }
  .ps textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--ink); font-family: var(--mono); font-size: 16.5px; padding: 0 0 0 8px; caret-color: var(--caret); resize: vertical; min-height: 1.5em; line-height: 1.5; min-width: 0; }
  .ps.correct { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }
  .ps.wrong { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
  .ps.multiline { align-items: flex-start; }
  .target { margin-top: 12px; font-size: 16.5px; color: var(--dim); padding: 10px 14px; border: 1px dashed var(--rule); border-radius: 4px; background: rgba(0,0,0,0.28); white-space: pre; overflow-x: auto; }
  .target .hit { color: var(--ok); }
  .target .miss { color: var(--bad); text-decoration: underline; }
  .feedback { margin-top: 14px; font-size: 14px; min-height: 22px; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .row { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font-family: var(--mono); font-size: 14px; cursor: pointer; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 5px; padding: 9px 16px; transition: background .15s, border-color .15s, transform .05s; }
  button:hover { border-color: var(--accent); filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--bg-deep); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--caret); outline-offset: 2px; }
  .spacer { flex: 1; }
  kbd { font-family: var(--mono); font-size: 11.5px; background: rgba(0,0,0,0.4); color: var(--dim); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; }
  .center { text-align: center; padding: 8px 0 4px; }
  h1.brand { font-size: 26px; margin: 4px 0 6px; letter-spacing: 0.01em; font-weight: 600; }
  h1.brand .gt { color: var(--ok); }
  .tagline { color: var(--dim); font-size: 14px; margin: 0 0 18px; }
  /* --- contents dashboard --- */
  .statrow { display: flex; gap: 12px; justify-content: center; margin: 2px 0 22px; flex-wrap: wrap; }
  .stat { border: 1px solid var(--rule); border-radius: 6px; padding: 9px 18px 8px; min-width: 104px; text-align: center; background: rgba(0,0,0,0.22); }
  .stat .v { font-size: 22px; font-weight: 600; line-height: 1.25; }
  .stat .k { color: var(--dim); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
  .toc { border: 1px solid var(--rule); border-radius: 6px; background: rgba(0,0,0,0.22); overflow: hidden; margin-top: 8px; }
  .cat + .cat { border-top: 1px solid var(--rule); }
  .cathead { display: flex; align-items: center; }
  .catmain { flex: 1; display: flex; align-items: center; gap: 10px; background: none; border: none; border-radius: 0; padding: 11px 12px; text-align: left; font-size: 14px; color: var(--ink); min-width: 0; }
  .catmain:hover { background: rgba(255,255,255,0.045); border-color: transparent; filter: none; }
  .tri { color: var(--dim); font-size: 11px; width: 13px; flex: none; transition: transform .15s; display: inline-block; }
  .cat.open .tri { transform: rotate(90deg); }
  .catname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .catmeta { margin-left: auto; display: flex; align-items: center; gap: 12px; flex: none; }
  .catbar { width: 84px; height: 5px; background: rgba(127,127,127,0.18); border-radius: 3px; overflow: hidden; }
  .catbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); }
  .catcount { color: var(--dim); font-size: 12px; white-space: nowrap; min-width: 78px; text-align: right; }
  .drill { margin-right: 10px; padding: 5px 13px; font-size: 12.5px; flex: none; }
  .catcards { display: none; padding: 2px 14px 12px 35px; }
  .cat.open .catcards { display: block; }
  .cc { display: flex; align-items: baseline; gap: 9px; padding: 3.5px 0; font-size: 13px; min-width: 0; }
  .cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; border: 1px solid var(--dim); background: transparent; }
  .cdot.clean { background: var(--ok); border-color: var(--ok); }
  .cdot.retry { background: var(--caret); border-color: var(--caret); }
  .ccmd { color: var(--accent); flex: none; }
  .ccd { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { color: var(--dim); font-size: 11.5px; margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
  .legend .cdot { display: inline-block; vertical-align: middle; margin-right: 5px; }
  details.how { margin-top: 20px; color: var(--dim); font-size: 13px; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; background: rgba(0,0,0,0.18); }
  details.how summary { cursor: pointer; color: var(--ink); font-size: 13px; letter-spacing: 0.04em; }
  details.how ol { margin: 10px 0 4px; padding-left: 20px; }
  details.how li { margin: 6px 0; }
  details.how li b { color: var(--ink); }
  .resetline { margin-top: 14px; text-align: center; }
  .resetline button { background: none; border: none; color: var(--dim); font-size: 11.5px; text-decoration: underline; padding: 4px 6px; }
  .resetline button:hover { color: var(--bad); filter: none; }
  .summary-grid { display: flex; gap: 26px; justify-content: center; margin: 18px 0 8px; flex-wrap: wrap; }
  .summary-grid .k { color: var(--dim); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .summary-grid .v { font-size: 30px; font-weight: 600; }
  .hide { display: none !important; }
  .small { font-size: 12.5px; color: var(--dim); }
  .toughlist { text-align: left; max-width: 560px; margin: 10px auto 0; }
  .toughlist .ti { padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .toughlist code { color: var(--caret); }
  @media (max-width: 560px) {
    body { font-size: 14px; }
    .wrap { padding: 12px 10px 60px; }
    .console { padding: 16px 13px 20px; }
    .syntaxbox { font-size: 15px; padding: 12px 13px; }
    .ps, .ps input, .ps textarea, .target { font-size: 15px; }
    .catbar { display: none; }
    .catcount { min-width: 0; }
    .catcards { padding-left: 24px; }
    .summary-grid { gap: 16px; }
    h1.brand { font-size: 21px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="name">Windows PowerShell — syntax crammer</span>
    <button class="tbnav hide" id="tbHome" title="End this session and return to the contents page">&#9776; contents</button>
  </div>
  <div class="console" id="console"></div>
  <div class="stripwrap" id="stripwrap" style="visibility:hidden">
    <div class="stripmeta"><span id="stripleft">deck</span><span id="stripright">0 / 0 learned</span></div>
    <div class="strip"><i id="stripfill"></i></div>
  </div>
</div>
<script>
/* ============================================================
   SYNTAX CRAMMER — generic engine
   Generated for subject: PowerShell
   Matching mode: strict   (strict | forgiving)
   ============================================================ */

const SUBJECT = "PowerShell";
const MATCH_MODE = "strict";   // "strict" or "forgiving"
const MULTILINE = false;        // true => use a textarea (Python/JSON blocks)

/* DECK is injected here. Each: { cmd, cat, syntax, desc, note } */
const DECK = [
  {
    "cmd": "Get-ChildItem",
    "cat": "Navigation",
    "syntax": "Get-ChildItem",
    "desc": "List the files and folders in the current location.",
    "note": "Aliases: <span class='alias'>ls</span>, <span class='alias'>dir</span>, <span class='alias'>gci</span>. Returns file <b>objects</b>, not text."
  },
  {
    "cmd": "Get-Location",
    "cat": "Navigation",
    "syntax": "Get-Location",
    "desc": "Show the directory you are currently in.",
    "note": "Alias: <span class='alias'>pwd</span>. 'Get the location.'"
  },
  {
    "cmd": "Set-Location",
    "cat": "Navigation",
    "syntax": "Set-Location C:\\Projects",
    "desc": "Change into another directory (here, C:\\Projects).",
    "note": "Alias: <span class='alias'>cd</span>. Note Windows backslashes in the path."
  },
  {
    "cmd": "New-Item (file)",
    "cat": "Files & folders",
    "syntax": "New-Item draft.txt",
    "desc": "Create a new, empty file called draft.txt.",
    "note": "Add <b>-ItemType Directory</b> to make a folder instead."
  },
  {
    "cmd": "New-Item (folder)",
    "cat": "Files & folders",
    "syntax": "New-Item notes -ItemType Directory",
    "desc": "Create a new folder called notes.",
    "note": "The -ItemType parameter decides file vs folder. <span class='alias'>mkdir</span> is a shortcut for the folder case."
  },
  {
    "cmd": "Get-Content",
    "cat": "Files & folders",
    "syntax": "Get-Content draft.txt",
    "desc": "Print the contents of a file to the screen.",
    "note": "Aliases: <span class='alias'>cat</span>, <span class='alias'>gc</span>, <span class='alias'>type</span>."
  },
  {
    "cmd": "Set-Content",
    "cat": "Files & folders",
    "syntax": "Set-Content draft.txt 'hello'",
    "desc": "Write text into a file, replacing whatever was there.",
    "note": "Overwrites. Use <b>Add-Content</b> to append instead."
  },
  {
    "cmd": "Add-Content",
    "cat": "Files & folders",
    "syntax": "Add-Content draft.txt 'more'",
    "desc": "Append text to the end of a file without erasing it.",
    "note": "The append cousin of Set-Content."
  },
  {
    "cmd": "Copy-Item",
    "cat": "Files & folders",
    "syntax": "Copy-Item a.txt b.txt",
    "desc": "Copy a file (a.txt) to a new name or place (b.txt).",
    "note": "Aliases: <span class='alias'>cp</span>, <span class='alias'>copy</span>. Add <b>-Recurse</b> for folders."
  },
  {
    "cmd": "Move-Item",
    "cat": "Files & folders",
    "syntax": "Move-Item a.txt b.txt",
    "desc": "Move or rename a file from a.txt to b.txt.",
    "note": "Aliases: <span class='alias'>mv</span>, <span class='alias'>move</span>. Move and rename are the same operation."
  },
  {
    "cmd": "Remove-Item",
    "cat": "Files & folders",
    "syntax": "Remove-Item old.txt",
    "desc": "Delete a file called old.txt.",
    "note": "Aliases: <span class='alias'>rm</span>, <span class='alias'>del</span>. <b>No recycle bin.</b> Add -Recurse for folders; pause before you do."
  },
  {
    "cmd": "Rename-Item",
    "cat": "Files & folders",
    "syntax": "Rename-Item a.txt b.txt",
    "desc": "Rename a.txt to b.txt (without moving it).",
    "note": "Alias: <span class='alias'>ren</span>."
  },
  {
    "cmd": "Select-String",
    "cat": "Search & paths",
    "syntax": "Select-String 'budget' report.txt",
    "desc": "Search for the text 'budget' inside report.txt.",
    "note": "PowerShell's <span class='alias'>grep</span>. Returns match objects with line numbers."
  },
  {
    "cmd": "Select-Object",
    "cat": "The pipeline",
    "syntax": "Get-ChildItem | Select-Object Name, Length",
    "desc": "Pick only certain properties (Name and size) from each item.",
    "note": "Alias: <span class='alias'>select</span>. This is the object model in action: ask each file for named properties."
  },
  {
    "cmd": "Where-Object",
    "cat": "The pipeline",
    "syntax": "Get-ChildItem | Where-Object Length -gt 1000",
    "desc": "Keep only the items whose size is greater than 1000 bytes.",
    "note": "Alias: <span class='alias'>where</span>, <span class='alias'>?</span>. -gt means 'greater than'."
  },
  {
    "cmd": "Sort-Object",
    "cat": "The pipeline",
    "syntax": "Get-ChildItem | Sort-Object Length -Descending",
    "desc": "Sort items by a property (size), biggest first.",
    "note": "Alias: <span class='alias'>sort</span>. Reads almost like English."
  },
  {
    "cmd": "Measure-Object",
    "cat": "The pipeline",
    "syntax": "Get-ChildItem | Measure-Object",
    "desc": "Count items, or total/average a numeric property.",
    "note": "Alias: <span class='alias'>measure</span>. Add -Sum -Property Length to total file sizes."
  },
  {
    "cmd": "ForEach-Object",
    "cat": "The pipeline",
    "syntax": "Get-ChildItem | ForEach-Object { $_.Name }",
    "desc": "Run an action once for every item coming down the pipeline.",
    "note": "Aliases: <span class='alias'>foreach</span>, <span class='alias'>%</span>. <b>$_</b> means 'the current item'."
  },
  {
    "cmd": "Get-Command",
    "cat": "Discovery & help",
    "syntax": "Get-Command",
    "desc": "List every command available to you.",
    "note": "Alias: <span class='alias'>gcm</span>. Add -Name '*item*' to filter."
  },
  {
    "cmd": "Get-Help",
    "cat": "Discovery & help",
    "syntax": "Get-Help Get-ChildItem",
    "desc": "Show the help page for a command.",
    "note": "Alias: <span class='alias'>help</span>. Add <b>-Examples</b> for worked examples."
  },
  {
    "cmd": "Get-Member",
    "cat": "Discovery & help",
    "syntax": "Get-ChildItem | Get-Member",
    "desc": "List the properties and methods an object actually has.",
    "note": "Alias: <span class='alias'>gm</span>. The way to discover what you can ask an object for."
  },
  {
    "cmd": "Get-Process",
    "cat": "Processes & services",
    "syntax": "Get-Process",
    "desc": "List the programs currently running.",
    "note": "Alias: <span class='alias'>ps</span>, <span class='alias'>gps</span>."
  },
  {
    "cmd": "Stop-Process",
    "cat": "Processes & services",
    "syntax": "Stop-Process -Name notepad",
    "desc": "Stop a running program by name (here, notepad).",
    "note": "Alias: <span class='alias'>kill</span>. Can also take -Id."
  },
  {
    "cmd": "Get-Service",
    "cat": "Processes & services",
    "syntax": "Get-Service",
    "desc": "List the Windows services and their status.",
    "note": "Alias: <span class='alias'>gsv</span>."
  },
  {
    "cmd": "Write-Output",
    "cat": "Output & console",
    "syntax": "Write-Output 'hello'",
    "desc": "Send text (or an object) down the pipeline / to the screen.",
    "note": "Aliases: <span class='alias'>echo</span>, <span class='alias'>write</span>."
  },
  {
    "cmd": "Write-Host",
    "cat": "Output & console",
    "syntax": "Write-Host 'hello'",
    "desc": "Print text straight to the screen (not the pipeline).",
    "note": "Use for messages to the user; Write-Output for data you might pipe on."
  },
  {
    "cmd": "Clear-Host",
    "cat": "Output & console",
    "syntax": "Clear-Host",
    "desc": "Clear everything off the screen.",
    "note": "Aliases: <span class='alias'>cls</span>, <span class='alias'>clear</span>."
  },
  {
    "cmd": "Get-History",
    "cat": "Session & system",
    "syntax": "Get-History",
    "desc": "Show the commands you have run this session.",
    "note": "Alias: <span class='alias'>history</span>, <span class='alias'>h</span>."
  },
  {
    "cmd": "Test-Path",
    "cat": "Search & paths",
    "syntax": "Test-Path draft.txt",
    "desc": "Check whether a file or folder exists (True/False).",
    "note": "Handy before reading or writing."
  },
  {
    "cmd": "Resolve-Path",
    "cat": "Search & paths",
    "syntax": "Resolve-Path .\\notes",
    "desc": "Turn a relative path into a full absolute one.",
    "note": "The .\\ means 'in the current folder'."
  },
  {
    "cmd": "Select-Object -First",
    "cat": "The pipeline",
    "syntax": "Get-ChildItem | Select-Object -First 5",
    "desc": "Take just the first 5 items.",
    "note": "Pair with -Last 5 for the tail. This is your 'head' equivalent."
  },
  {
    "cmd": "Get-Content -Tail",
    "cat": "Search & paths",
    "syntax": "Get-Content log.txt -Tail 20",
    "desc": "Show the last 20 lines of a file.",
    "note": "Add <b>-Wait</b> to follow a log live as it grows."
  },
  {
    "cmd": "Out-File",
    "cat": "Output & console",
    "syntax": "Get-ChildItem | Out-File list.txt",
    "desc": "Send output into a file instead of the screen.",
    "note": "Like the > redirect. Out-File gives you encoding control."
  },
  {
    "cmd": "Invoke-WebRequest",
    "cat": "Web & APIs",
    "syntax": "Invoke-WebRequest https://example.com",
    "desc": "Fetch a web page or file over HTTP.",
    "note": "Aliases: <span class='alias'>iwr</span>, <span class='alias'>curl</span>, <span class='alias'>wget</span>. (The aliases behave differently from real curl.)"
  },
  {
    "cmd": "Invoke-RestMethod",
    "cat": "Web & APIs",
    "syntax": "Invoke-RestMethod https://api.example.com",
    "desc": "Call a web API and get back parsed objects (e.g. JSON).",
    "note": "Alias: <span class='alias'>irm</span>. Better than Invoke-WebRequest for APIs; it parses the response for you."
  },
  {
    "cmd": "ConvertTo-Json",
    "cat": "JSON & CSV data",
    "syntax": "Get-Process | ConvertTo-Json",
    "desc": "Turn objects into JSON text.",
    "note": "Pair with <b>ConvertFrom-Json</b> to go the other way."
  },
  {
    "cmd": "ConvertFrom-Json",
    "cat": "JSON & CSV data",
    "syntax": "Get-Content data.json | ConvertFrom-Json",
    "desc": "Turn JSON text back into objects you can query.",
    "note": "Read a file, then parse it into real objects."
  },
  {
    "cmd": "Import-Csv",
    "cat": "JSON & CSV data",
    "syntax": "Import-Csv people.csv",
    "desc": "Read a CSV file in as objects with named columns.",
    "note": "Each row becomes an object; column headers become properties."
  },
  {
    "cmd": "Export-Csv",
    "cat": "JSON & CSV data",
    "syntax": "Get-Process | Export-Csv procs.csv",
    "desc": "Write objects out to a CSV file.",
    "note": "Add <b>-NoTypeInformation</b> to drop the header comment line."
  },
  {
    "cmd": "Get-Date",
    "cat": "Session & system",
    "syntax": "Get-Date",
    "desc": "Show the current date and time as an object.",
    "note": "Has properties like .Year and .DayOfWeek you can ask for."
  },
  {
    "cmd": "Set-ExecutionPolicy",
    "cat": "Session & system",
    "syntax": "Set-ExecutionPolicy RemoteSigned",
    "desc": "Control whether scripts are allowed to run.",
    "note": "Common when a script is blocked. Run in an elevated prompt."
  },
  {
    "cmd": "Get-Alias",
    "cat": "Discovery & help",
    "syntax": "Get-Alias ls",
    "desc": "Find out what real command an alias points to.",
    "note": "Tells you that ls means Get-ChildItem. Run it to demystify any shortcut."
  }
];

/* Topics, in order of first appearance in the deck. Each -> list of deck indices. */
const TOPICS = (() => {
  const m = new Map();
  DECK.forEach((c, i) => {
    const k = c.cat || "General";
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(i);
  });
  return Array.from(m, ([name, idxs]) => ({ name, idxs }));
})();

/* ---- per-card progress, persisted across visits ----
   prog[cmd] = { r: "clean" | "retry", t: epoch-ms }
   "clean" = recalled first try last time; "retry" = needed another go. */
const PKEY = "syntax-crammer::" + SUBJECT;
function loadProg() { try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { return {}; } }
function saveProg(p) { try { localStorage.setItem(PKEY, JSON.stringify(p)); } catch (e) {} }
function recordResult(cmd, clean) {
  const p = loadProg();
  p[cmd] = { r: clean ? "clean" : "retry", t: Date.now() };
  saveProg(p);
}

/* ---- state ---- */
let queue = [], card = null, stage = "learn";
let learnedSet = new Set(), attempts = 0, hits = 0, missCount = {};
let scopeTopic = null;      // null = full deck, otherwise a topic name
let sessionTotal = 0;

const consoleEl = document.getElementById('console');
const stripwrap = document.getElementById('stripwrap');
const stripfill = document.getElementById('stripfill');
const stripleft = document.getElementById('stripleft');
const stripright = document.getElementById('stripright');
const tbHome = document.getElementById('tbHome');
tbHome.onclick = renderStart;

/* one managed document-level Enter handler, so stale ones never stack up */
let enterHandler = null;
function onGlobalEnter(fn) {
  if (enterHandler) { document.removeEventListener('keydown', enterHandler); enterHandler = null; }
  if (!fn) return;
  enterHandler = (e) => {
    if (e.key !== "Enter") return;
    if (e.target.closest && e.target.closest("button, a, input, textarea, summary")) return;
    e.preventDefault(); fn();
  };
  document.addEventListener('keydown', enterHandler);
}

/* ---- matching ---- */
function normalise(s) {
  if (MATCH_MODE === "strict") return s;
  // forgiving: unify quotes, collapse whitespace, and ignore the optional spaces
  // formula languages allow around brackets, commas and operators, so
  // "= SUMIF( A, B )" matches "=SUMIF(A,B)". Crucially, spaces *inside* a quoted
  // string are preserved, because there a space can be the answer (e.g. the
  // ", " delimiter in TEXTJOIN).
  let s2 = s
    .replace(/\r\n/g, "\n")
    .replace(/[‘’]/g, "'")          // curly single quotes -> straight
    .replace(/[“”]/g, '"')          // curly double quotes -> straight
    .replace(/[ \t]+/g, " ")
    .trim()
    .replace(/;+\s*$/g, "");                   // ignore a trailing semicolon
  // Split on quoted runs ("..." or '...'); only tidy the parts OUTSIDE quotes.
  const parts = s2.split(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {  // even indices are the unquoted segments
      parts[i] = parts[i].replace(/\s*([(),=+\-*/<>!&\[\]{}:;])\s*/g, "$1");
    }
    // odd indices are quoted strings: left exactly as typed
  }
  return parts.join("");
}
function isMatch(typed, target) { return normalise(typed) === normalise(target); }

/* ---- contents / dashboard (start screen) ---- */
function renderStart() {
  stripwrap.style.visibility = "hidden";
  tbHome.classList.add('hide');
  const prog = loadProg();
  const masteredTotal = DECK.filter(c => (prog[c.cmd] || {}).r === "clean").length;
  const anyProgress = Object.keys(prog).length > 0;
  const modeWord = MATCH_MODE === "strict"
    ? "Matching is strict: spelling, capitals, spaces and punctuation all count."
    : "Matching is forgiving on spacing and quote style, but the structure must be right.";

  const topicRows = TOPICS.map((t, ti) => {
    const clean = t.idxs.filter(i => (prog[DECK[i].cmd] || {}).r === "clean").length;
    const pct = Math.round(clean / t.idxs.length * 100);
    const cardRows = t.idxs.map(i => {
      const c = DECK[i];
      const st = (prog[c.cmd] || {}).r;
      return `<div class="cc"><span class="cdot ${st || ""}"></span><code class="ccmd">${escapeHtml(c.cmd)}</code><span class="ccd">${c.desc}</span></div>`;
    }).join("");
    return `
      <div class="cat" id="cat${ti}">
        <div class="cathead">
          <button class="catmain" data-ti="${ti}" aria-expanded="false" aria-controls="catcards${ti}">
            <span class="tri">&#9656;</span>
            <span class="catname">${escapeHtml(t.name)}</span>
            <span class="catmeta">
              <span class="catbar"><i style="width:${pct}%"></i></span>
              <span class="catcount">${clean ? clean + "/" + t.idxs.length + " &#10003;" : t.idxs.length + " cards"}</span>
            </span>
          </button>
          <button class="drill ghost" data-ti="${ti}" title="Drill just this topic">Drill</button>
        </div>
        <div class="catcards" id="catcards${ti}">${cardRows}</div>
      </div>`;
  }).join("");

  consoleEl.innerHTML = `
    <div class="center">
      <h1 class="brand"><span class="gt">&gt;_</span> ${SUBJECT} Syntax Crammer</h1>
      <p class="tagline">Learn &rarr; copy &rarr; recall, until every card sticks.</p>
    </div>
    <div class="statrow">
      <div class="stat"><div class="v">${DECK.length}</div><div class="k">cards</div></div>
      <div class="stat"><div class="v">${TOPICS.length}</div><div class="k">topics</div></div>
      <div class="stat"><div class="v" style="color:${masteredTotal ? 'var(--ok)' : 'var(--dim)'}">${masteredTotal}<span class="small">/${DECK.length}</span></div><div class="k">mastered</div></div>
    </div>
    <div class="label">Contents &mdash; click a topic to see its cards</div>
    <div class="toc">${topicRows}</div>
    <div class="legend">
      <span><span class="cdot clean"></span>recalled first try</span>
      <span><span class="cdot retry"></span>needed retries</span>
      <span><span class="cdot"></span>not drilled yet</span>
    </div>
    <div class="row center" style="justify-content:center; margin-top:24px">
      <button class="primary" id="startBtn">Start the full deck &nbsp;&crarr;</button>
    </div>
    <details class="how"${anyProgress ? "" : " open"}>
      <summary>How a session works</summary>
      <ol>
        <li><b>Learn</b> &mdash; you see what a card does and its exact syntax.</li>
        <li><b>Copy</b> &mdash; type it once while looking, to wire in the keystrokes.</li>
        <li><b>Recall</b> &mdash; type it from memory.</li>
      </ol>
      <div style="margin-top:8px">Miss a recall and the card resurfaces later in the session until it sticks. ${modeWord} <kbd>${MULTILINE ? "Ctrl+Enter" : "Enter"}</kbd> checks your answer.</div>
    </details>
    ${anyProgress ? `<div class="resetline"><button id="resetBtn">reset saved progress</button></div>` : ""}
  `;

  consoleEl.querySelectorAll('.catmain').forEach(btn => {
    btn.onclick = () => {
      const cat = document.getElementById('cat' + btn.dataset.ti);
      const open = cat.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? "true" : "false");
    };
  });
  consoleEl.querySelectorAll('.drill').forEach(btn => {
    btn.onclick = () => startSession(TOPICS[btn.dataset.ti].name);
  });
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.onclick = () => {
    if (resetBtn.dataset.armed) { try { localStorage.removeItem(PKEY); } catch (e) {} renderStart(); }
    else { resetBtn.dataset.armed = "1"; resetBtn.textContent = "sure? click again to wipe it"; }
  };
  const startBtn = document.getElementById('startBtn');
  startBtn.onclick = () => startSession(null);
  startBtn.focus({ preventScroll: true });
  onGlobalEnter(() => startSession(null));
}

/* ---- session ---- */
function startSession(topicName) {
  onGlobalEnter(null);
  scopeTopic = topicName;
  queue = topicName === null
    ? DECK.map((_, i) => i)
    : (TOPICS.find(t => t.name === topicName) || { idxs: [] }).idxs.slice();
  if (!queue.length) { renderStart(); return; }
  sessionTotal = queue.length;
  learnedSet = new Set(); attempts = 0; hits = 0; missCount = {};
  stripwrap.style.visibility = "visible";
  tbHome.classList.remove('hide');
  nextCard();
}
function nextCard() {
  if (queue.length === 0) { renderSummary(); return; }
  card = { ...DECK[queue[0]], _idx: queue[0] };
  stage = "learn"; renderCard(); updateStrip();
}
function updateStrip() {
  const learned = learnedSet.size;
  stripfill.style.width = (learned / sessionTotal * 100) + "%";
  stripleft.textContent = (scopeTopic === null ? "full deck" : scopeTopic) + " · queue: " + queue.length;
  stripright.textContent = learned + " / " + sessionTotal + " learned";
}
function topicPill() {
  return card.cat ? ` <span class="pill topic">${escapeHtml(card.cat)}</span>` : "";
}
function renderCard() {
  if (stage === "learn") return renderLearn();
  return renderType(stage === "copy" ? "copy" : "recall");
}
function renderLearn() {
  consoleEl.innerHTML = `
    <div class="eyebrow">Learn <span class="pill">${escapeHtml(card.cmd)}</span>${topicPill()}</div>
    <p class="desc">${card.desc}</p>
    <div class="label" style="margin-top:18px">Syntax</div>
    <div class="syntaxbox">${escapeHtml(card.syntax)}</div>
    <p class="note">${card.note}</p>
    <div class="row">
      <button class="primary" id="go">I've read it &mdash; let me type it &rarr;</button>
      <div class="spacer"></div>
      <button class="ghost" id="skip">Skip card</button>
    </div>`;
  const go = document.getElementById('go');
  go.onclick = () => { stage = "copy"; renderCard(); };
  document.getElementById('skip').onclick = () => { dropCard(); nextCard(); };
  go.focus({ preventScroll: true });
  onGlobalEnter(() => go.click());
}
function renderType(mode) {
  onGlobalEnter(null);
  const isCopy = mode === "copy";
  const field = MULTILINE
    ? `<textarea id="entry" rows="${Math.min(10, card.syntax.split("\n").length + 1)}" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>`
    : `<input id="entry" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />`;
  consoleEl.innerHTML = `
    <div class="eyebrow">${isCopy ? "Copy" : "Recall"} <span class="pill">${escapeHtml(card.cmd)}</span>${topicPill()}</div>
    <p class="desc">${card.desc}</p>
    ${isCopy ? `<div class="label" style="margin-top:16px">Type this exactly</div><div class="target" id="target">${escapeHtml(card.syntax)}</div>`
             : `<p class="note" style="margin-top:8px">From memory.</p>`}
    <div class="promptline">
      <div class="ps ${MULTILINE ? 'multiline' : ''}" id="psline">
        <span class="sigil"></span>
        ${field}
      </div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="row">
      <button class="primary" id="check">Check &nbsp;&crarr;</button>
      ${isCopy ? "" : `<button class="ghost" id="reveal">Show answer</button>`}
      <div class="spacer"></div>
      <span class="small">${isCopy ? "Live-matched against the target." : (MATCH_MODE === "strict" ? "Strict match." : "Forgiving match.")}</span>
    </div>`;
  const entry = document.getElementById('entry');
  const psline = document.getElementById('psline');
  const fb = document.getElementById('fb');
  const targetEl = document.getElementById('target');
  entry.focus();
  if (isCopy && targetEl) entry.addEventListener('input', () => paintTarget(targetEl, card.syntax, entry.value));

  function attempt() {
    if (isMatch(entry.value, card.syntax)) {
      psline.classList.remove('wrong'); psline.classList.add('correct');
      fb.className = "feedback ok";
      fb.textContent = isCopy ? "Matched. Now the real test." : "Correct. Locked in.";
      if (!isCopy) { hits++; attempts++; recordResult(card.cmd, !missCount[card.cmd]); }
      setTimeout(() => {
        if (isCopy) { stage = "recall"; renderCard(); }
        else { learnedSet.add(card.cmd); dropCard(); nextCard(); }
      }, 480);
    } else {
      psline.classList.remove('correct'); psline.classList.add('wrong');
      fb.className = "feedback bad";
      if (isCopy) {
        fb.textContent = "Not quite, the highlight shows where it differs.";
        if (targetEl) paintTarget(targetEl, card.syntax, entry.value);
      } else {
        attempts++; missCount[card.cmd] = (missCount[card.cmd] || 0) + 1;
        fb.innerHTML = "Missed. This card will come back. Try again, or reveal.";
        requeueCurrent();
        entry.select();
      }
    }
  }
  document.getElementById('check').onclick = attempt;
  entry.addEventListener('keydown', (e) => {
    if (e.key === "Enter" && (!MULTILINE || e.ctrlKey || e.metaKey)) { e.preventDefault(); attempt(); }
  });
  if (!isCopy) document.getElementById('reveal').onclick = () => {
    fb.className = "feedback bad";
    fb.innerHTML = "Answer: <b>" + escapeHtml(card.syntax) + "</b> &nbsp;(card requeued)";
    missCount[card.cmd] = (missCount[card.cmd] || 0) + 1; requeueCurrent();
    entry.value = ""; entry.focus();
  };
}
function requeueCurrent() {
  const idx = queue.shift();
  const insertAt = Math.min(queue.length, 3 + Math.floor(Math.random() * 3));
  queue.splice(insertAt, 0, idx); updateStrip();
}
function dropCard() { queue.shift(); updateStrip(); }
function paintTarget(el, target, typed) {
  let html = "", diverged = false;
  for (let i = 0; i < target.length; i++) {
    const ch = escapeHtml(target[i]);
    if (!diverged && i < typed.length && typed[i] === target[i]) html += "<span class='hit'>" + ch + "</span>";
    else if (!diverged && i < typed.length && typed[i] !== target[i]) { html += "<span class='miss'>" + ch + "</span>"; diverged = true; }
    else html += ch;
  }
  el.innerHTML = html;
}
function renderSummary() {
  stripwrap.style.visibility = "hidden";
  tbHome.classList.add('hide');
  const accuracy = attempts ? Math.round(hits / attempts * 100) : 0;
  const tough = Object.entries(missCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const scopeWord = scopeTopic === null ? "deck" : `<b>${escapeHtml(scopeTopic)}</b> topic`;
  consoleEl.innerHTML = `
    <div class="center">
      <h1 class="brand"><span class="gt">&gt;_</span> ${scopeTopic === null ? "Deck" : "Topic"} cleared</h1>
      <p class="tagline">${learnedSet.size} of ${sessionTotal} ${scopeWord} cards recalled from memory.</p>
      <div class="summary-grid">
        <div><div class="v" style="color:var(--ok)">${learnedSet.size}</div><div class="k">learned</div></div>
        <div><div class="v">${attempts}</div><div class="k">recall attempts</div></div>
        <div><div class="v" style="color:${accuracy >= 80 ? 'var(--ok)' : 'var(--caret)'}">${accuracy}%</div><div class="k">first-try rate</div></div>
      </div>
      ${tough.length ? `<div class="label" style="margin-top:18px">Worth another look</div>
        <div class="toughlist">${tough.map(([c, n]) => `<div class="ti"><code>${escapeHtml(c)}</code> &mdash; missed ${n} time${n > 1 ? 's' : ''}</div>`).join("")}</div>`
        : `<p class="note center" style="margin-top:16px">Clean run, nothing tripped you up.</p>`}
    </div>
    <div class="row center" style="justify-content:center; margin-top:24px">
      <button class="primary" id="again">Run it again</button>
      <button class="ghost" id="toughonly" ${tough.length ? '' : 'disabled'}>Drill just the missed ones</button>
      <button class="ghost" id="home">Contents</button>
    </div>`;
  document.getElementById('again').onclick = () => startSession(scopeTopic);
  document.getElementById('home').onclick = renderStart;
  document.getElementById('toughonly').onclick = () => {
    const t = new Set(tough.map(x => x[0]));
    queue = DECK.map((_, i) => i).filter(i => t.has(DECK[i].cmd));
    if (!queue.length) { startSession(scopeTopic); return; }
    sessionTotal = queue.length;
    learnedSet = new Set(); attempts = 0; hits = 0; missCount = {};
    stripwrap.style.visibility = "visible"; tbHome.classList.remove('hide');
    nextCard();
  };
  document.getElementById('again').focus({ preventScroll: true });
}
function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* favicon: subject initial on the theme accent, so browser tabs are tellable apart */
(function () {
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim() || "#888";
  const deep = css.getPropertyValue('--bg-deep').trim() || "#000";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="13" fill="${accent}"/><text x="32" y="45" font-size="38" font-family="monospace" font-weight="bold" text-anchor="middle" fill="${deep}">${escapeHtml(SUBJECT[0] || "?")}</text></svg>`;
  const link = document.createElement('link');
  link.rel = "icon";
  link.href = "data:image/svg+xml," + encodeURIComponent(svg);
  document.head.appendChild(link);
})();

renderStart();
</script>
</body>
</html>
