<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Excel Syntax Crammer — an interactive trainer that drills Excel syntax in three passes: learn, copy, recall.">
<title>Excel Syntax Crammer</title>
<style>
  :root {
    /* THEME TOKENS — replaced per subject. Defaults = PowerShell blue. */
    --bg: #13351f;
    --bg-deep: #0c2415;
    --panel: #1b4a2c;
    --ink: #eaf5ee;
    --dim: #a7c9b4;
    --caret: #ffe066;
    --ok: #6dd58c;
    --bad: #ff8a8a;
    --accent: #7ce0a8;
    --rule: rgba(167,201,180,0.24);
    --mono: "Cascadia Code", "Consolas", ui-monospace, Menlo, monospace;
    --sigil-text: "fx  =";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #1c4a2c 0%, #13351f 50%, #0c2415 100%);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px; line-height: 1.5;
    min-height: 100%; display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 820px; padding: 22px 18px 80px; }
  .titlebar {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    background: var(--bg-deep); border: 1px solid var(--rule); border-bottom: none; border-radius: 8px 8px 0 0;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .titlebar .name { margin-left: 6px; color: var(--dim); font-size: 12.5px; letter-spacing: 0.04em; }
  .tbnav { margin-left: auto; background: none; border: 1px solid var(--rule); font-size: 11.5px; padding: 3px 10px; color: var(--dim); border-radius: 4px; }
  .tbnav:hover { color: var(--ink); }
  .console {
    background: rgba(0,0,0,0.30); border: 1px solid var(--rule); border-radius: 0 0 8px 8px;
    padding: 22px 22px 26px; min-height: 320px; backdrop-filter: blur(2px);
  }
  .stripwrap { margin: 18px 2px 0; }
  .stripmeta { display: flex; justify-content: space-between; align-items: baseline; color: var(--dim); font-size: 12px; margin-bottom: 6px; letter-spacing: 0.03em; }
  .strip { height: 6px; width: 100%; background: rgba(127,127,127,0.18); border-radius: 4px; overflow: hidden; }
  .strip > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .35s ease; }
  .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .eyebrow .pill { border: 1px solid var(--rule); border-radius: 999px; padding: 2px 9px; color: var(--dim); letter-spacing: 0.06em; font-size: 11px; }
  .eyebrow .pill.topic { text-transform: none; }
  .desc { font-size: 16px; line-height: 1.55; margin: 0 0 4px; color: var(--ink); }
  .syntaxbox { margin: 18px 0 6px; padding: 16px 18px; background: rgba(0,0,0,0.34); border: 1px solid var(--rule); border-left: 1px solid var(--accent); border-radius: 4px; font-size: 17px; color: var(--ink); overflow-x: auto; white-space: pre; }
  .label { color: var(--dim); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .note { color: var(--dim); font-size: 13px; margin-top: 14px; }
  .note b { color: var(--ink); font-weight: 600; }
  .alias { color: var(--caret); }
  .promptline { margin-top: 22px; }
  .ps { display: flex; align-items: center; gap: 0; background: rgba(0,0,0,0.34); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; font-size: 16.5px; }
  .ps .sigil { color: var(--ok); white-space: nowrap; user-select: none; }
  .ps .sigil::after { content: var(--sigil-text); }
  .ps input { flex: 1; background: transparent; border: none; outline: none; color: var(--ink); font-family: var(--mono); font-size: 16.5px; padding: 0 0 0 8px; caret-color: var(--caret); min-width: 0; }
  .ps textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--ink); font-family: var(--mono); font-size: 16.5px; padding: 0 0 0 8px; caret-color: var(--caret); resize: vertical; min-height: 1.5em; line-height: 1.5; min-width: 0; }
  .ps.correct { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }
  .ps.wrong { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
  .ps.multiline { align-items: flex-start; }
  .target { margin-top: 12px; font-size: 16.5px; color: var(--dim); padding: 10px 14px; border: 1px dashed var(--rule); border-radius: 4px; background: rgba(0,0,0,0.28); white-space: pre; overflow-x: auto; }
  .target .hit { color: var(--ok); }
  .target .miss { color: var(--bad); text-decoration: underline; }
  .feedback { margin-top: 14px; font-size: 14px; min-height: 22px; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .row { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font-family: var(--mono); font-size: 14px; cursor: pointer; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 5px; padding: 9px 16px; transition: background .15s, border-color .15s, transform .05s; }
  button:hover { border-color: var(--accent); filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--bg-deep); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--caret); outline-offset: 2px; }
  .spacer { flex: 1; }
  kbd { font-family: var(--mono); font-size: 11.5px; background: rgba(0,0,0,0.4); color: var(--dim); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; }
  .center { text-align: center; padding: 8px 0 4px; }
  h1.brand { font-size: 26px; margin: 4px 0 6px; letter-spacing: 0.01em; font-weight: 600; }
  h1.brand .gt { color: var(--ok); }
  .tagline { color: var(--dim); font-size: 14px; margin: 0 0 18px; }
  /* --- contents dashboard --- */
  .statrow { display: flex; gap: 12px; justify-content: center; margin: 2px 0 22px; flex-wrap: wrap; }
  .stat { border: 1px solid var(--rule); border-radius: 6px; padding: 9px 18px 8px; min-width: 104px; text-align: center; background: rgba(0,0,0,0.22); }
  .stat .v { font-size: 22px; font-weight: 600; line-height: 1.25; }
  .stat .k { color: var(--dim); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
  .toc { border: 1px solid var(--rule); border-radius: 6px; background: rgba(0,0,0,0.22); overflow: hidden; margin-top: 8px; }
  .cat + .cat { border-top: 1px solid var(--rule); }
  .cathead { display: flex; align-items: center; }
  .catmain { flex: 1; display: flex; align-items: center; gap: 10px; background: none; border: none; border-radius: 0; padding: 11px 12px; text-align: left; font-size: 14px; color: var(--ink); min-width: 0; }
  .catmain:hover { background: rgba(255,255,255,0.045); border-color: transparent; filter: none; }
  .tri { color: var(--dim); font-size: 11px; width: 13px; flex: none; transition: transform .15s; display: inline-block; }
  .cat.open .tri { transform: rotate(90deg); }
  .catname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .catmeta { margin-left: auto; display: flex; align-items: center; gap: 12px; flex: none; }
  .catbar { width: 84px; height: 5px; background: rgba(127,127,127,0.18); border-radius: 3px; overflow: hidden; }
  .catbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); }
  .catcount { color: var(--dim); font-size: 12px; white-space: nowrap; min-width: 78px; text-align: right; }
  .drill { margin-right: 10px; padding: 5px 13px; font-size: 12.5px; flex: none; }
  .catcards { display: none; padding: 2px 14px 12px 35px; }
  .cat.open .catcards { display: block; }
  .cc { display: flex; align-items: baseline; gap: 9px; padding: 3.5px 0; font-size: 13px; min-width: 0; }
  .cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; border: 1px solid var(--dim); background: transparent; }
  .cdot.clean { background: var(--ok); border-color: var(--ok); }
  .cdot.retry { background: var(--caret); border-color: var(--caret); }
  .ccmd { color: var(--accent); flex: none; }
  .ccd { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { color: var(--dim); font-size: 11.5px; margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
  .legend .cdot { display: inline-block; vertical-align: middle; margin-right: 5px; }
  details.how { margin-top: 20px; color: var(--dim); font-size: 13px; border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; background: rgba(0,0,0,0.18); }
  details.how summary { cursor: pointer; color: var(--ink); font-size: 13px; letter-spacing: 0.04em; }
  details.how ol { margin: 10px 0 4px; padding-left: 20px; }
  details.how li { margin: 6px 0; }
  details.how li b { color: var(--ink); }
  .resetline { margin-top: 14px; text-align: center; }
  .resetline button { background: none; border: none; color: var(--dim); font-size: 11.5px; text-decoration: underline; padding: 4px 6px; }
  .resetline button:hover { color: var(--bad); filter: none; }
  .summary-grid { display: flex; gap: 26px; justify-content: center; margin: 18px 0 8px; flex-wrap: wrap; }
  .summary-grid .k { color: var(--dim); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .summary-grid .v { font-size: 30px; font-weight: 600; }
  .hide { display: none !important; }
  .small { font-size: 12.5px; color: var(--dim); }
  .toughlist { text-align: left; max-width: 560px; margin: 10px auto 0; }
  .toughlist .ti { padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .toughlist code { color: var(--caret); }
  @media (max-width: 560px) {
    body { font-size: 14px; }
    .wrap { padding: 12px 10px 60px; }
    .console { padding: 16px 13px 20px; }
    .syntaxbox { font-size: 15px; padding: 12px 13px; }
    .ps, .ps input, .ps textarea, .target { font-size: 15px; }
    .catbar { display: none; }
    .catcount { min-width: 0; }
    .catcards { padding-left: 24px; }
    .summary-grid { gap: 16px; }
    h1.brand { font-size: 21px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="name">Excel — formula crammer</span>
    <button class="tbnav hide" id="tbHome" title="End this session and return to the contents page">&#9776; contents</button>
  </div>
  <div class="console" id="console"></div>
  <div class="stripwrap" id="stripwrap" style="visibility:hidden">
    <div class="stripmeta"><span id="stripleft">deck</span><span id="stripright">0 / 0 learned</span></div>
    <div class="strip"><i id="stripfill"></i></div>
  </div>
</div>
<script>
/* ============================================================
   SYNTAX CRAMMER — generic engine
   Generated for subject: Excel
   Matching mode: forgiving   (strict | forgiving)
   ============================================================ */

const SUBJECT = "Excel";
const MATCH_MODE = "forgiving";   // "strict" or "forgiving"
const MULTILINE = false;        // true => use a textarea (Python/JSON blocks)

/* DECK is injected here. Each: { cmd, cat, syntax, desc, note } */
const DECK = [
  {
    "cmd": "SUM",
    "cat": "Basics & rounding",
    "syntax": "=SUM(B2:B100)",
    "desc": "Add up all the numbers in a range. Here: total the amounts in column B from row 2 to row 100.",
    "note": "The most basic aggregation. If you find yourself adding cells with + signs (=B2+B3+B4), use SUM instead."
  },
  {
    "cmd": "AVERAGE",
    "cat": "Basics & rounding",
    "syntax": "=AVERAGE(B2:B100)",
    "desc": "The mean of a range: adds the numbers and divides by how many there are. Here: the average amount in column B.",
    "note": "Ignores empty cells, but counts zeros. AVERAGEIF (later) lets you average only matching rows."
  },
  {
    "cmd": "COUNT",
    "cat": "Basics & rounding",
    "syntax": "=COUNT(B2:B100)",
    "desc": "Count how many cells in a range contain a number. Here: how many numeric entries are in column B.",
    "note": "Counts numbers only. For text or any non-empty cell, use COUNTA."
  },
  {
    "cmd": "COUNTA",
    "cat": "Basics & rounding",
    "syntax": "=COUNTA(A2:A100)",
    "desc": "Count how many cells are not empty, including text. Here: how many filled-in cells column A has.",
    "note": "The 'A' means 'all types'. Use COUNT for numbers only, COUNTA when names or text count too."
  },
  {
    "cmd": "COUNTBLANK",
    "cat": "Basics & rounding",
    "syntax": "=COUNTBLANK(A2:A100)",
    "desc": "Count how many cells in a range are empty. Here: how many gaps column A has.",
    "note": "Handy for spotting missing data in a list before you process it."
  },
  {
    "cmd": "MAX",
    "cat": "Basics & rounding",
    "syntax": "=MAX(B2:B100)",
    "desc": "The largest number in a range. Here: the biggest amount in column B.",
    "note": "MIN is the mirror image for the smallest."
  },
  {
    "cmd": "MIN",
    "cat": "Basics & rounding",
    "syntax": "=MIN(B2:B100)",
    "desc": "The smallest number in a range. Here: the lowest amount in column B.",
    "note": "Pairs with MAX. For conditional versions, see MAXIFS and MINIFS."
  },
  {
    "cmd": "MEDIAN",
    "cat": "Basics & rounding",
    "syntax": "=MEDIAN(B2:B100)",
    "desc": "The middle value when the numbers are lined up in order. Here: the median amount in column B.",
    "note": "Often more honest than AVERAGE when a few extreme values would skew the mean."
  },
  {
    "cmd": "ROUND",
    "cat": "Basics & rounding",
    "syntax": "=ROUND(B2,2)",
    "desc": "Round a number to a set number of decimal places. Here: round the value in B2 to 2 decimals.",
    "note": "Two parts: the number, and how many decimals. Use 0 for whole numbers. ROUND follows normal rounding (.5 goes up)."
  },
  {
    "cmd": "ROUNDUP",
    "cat": "Basics & rounding",
    "syntax": "=ROUNDUP(B2,0)",
    "desc": "Round a number, always upward, to a set number of places. Here: round B2 up to the next whole number.",
    "note": "Forces the direction regardless of the digit. ROUNDDOWN always rounds toward zero instead."
  },
  {
    "cmd": "ROUNDDOWN",
    "cat": "Basics & rounding",
    "syntax": "=ROUNDDOWN(B2,0)",
    "desc": "Round a number, always downward, to a set number of places. Here: drop the decimals on B2 without rounding up.",
    "note": "The 'floor' partner of ROUNDUP. Useful when partial units shouldn't count."
  },
  {
    "cmd": "absolute ref $",
    "cat": "Basics & rounding",
    "syntax": "=B2*$F$1",
    "desc": "Lock a cell so it doesn't move when you copy the formula. Here: multiply each row's B by the SAME cell F1 every time.",
    "note": "<b>The single most important habit in this deck.</b> Without the $ signs, copying =B2*F1 down would drift to F2, F3, F4 and break. <b>$F$1</b> locks both column and row. You can lock just one: <b>$F1</b> (column fixed) or <b>F$1</b> (row fixed). Press F4 on a reference to cycle through the options."
  },
  {
    "cmd": "SUMIF",
    "cat": "Conditional sums & counts",
    "syntax": "=SUMIF(C2:C100,\"Darwin\",B2:B100)",
    "desc": "Add up numbers, but only the rows that match a condition. Here: total the amounts in column B, but only where column C says Darwin.",
    "note": "Three parts: <b>where to look</b> (C2:C100, the column holding your condition), <b>what to look for</b> (\"Darwin\"), and <b>what to add up</b> (B2:B100, the numbers). Read it as: 'go down column C; every time you see Darwin, grab the matching amount from column B; total them.' Plain SUM has no condition; SUMIF adds one."
  },
  {
    "cmd": "SUMIFS",
    "cat": "Conditional sums & counts",
    "syntax": "=SUMIFS(B2:B100,C2:C100,\"Darwin\",D2:D100,\">0\")",
    "desc": "Add up numbers that meet several conditions at once. Here: total column B where column C is Darwin AND column D is greater than zero.",
    "note": "Note the order flips from SUMIF: here the <b>numbers to add come first</b> (B2:B100), then pairs of (where-to-look, what-to-look-for). Add as many condition pairs as you need; all must be true for a row to count. When you have more than one condition, reach for SUMIFS, not SUMIF."
  },
  {
    "cmd": "COUNTIF",
    "cat": "Conditional sums & counts",
    "syntax": "=COUNTIF(C2:C100,\"Darwin\")",
    "desc": "Count how many cells match one condition. Here: how many rows in column C say Darwin.",
    "note": "Two parts: where to look, and what to look for. You can use wildcards: \"Dar*\" matches anything starting with Dar."
  },
  {
    "cmd": "COUNTIFS",
    "cat": "Conditional sums & counts",
    "syntax": "=COUNTIFS(C2:C100,\"Darwin\",D2:D100,\">0\")",
    "desc": "Count rows meeting several conditions. Here: how many rows are Darwin AND have column D greater than zero.",
    "note": "Pairs of (where-to-look, what-to-look-for), as many as you need. All conditions must hold for the row to be counted."
  },
  {
    "cmd": "AVERAGEIF",
    "cat": "Conditional sums & counts",
    "syntax": "=AVERAGEIF(C2:C100,\"Darwin\",B2:B100)",
    "desc": "Average only the rows that match a condition. Here: the average of column B for rows where column C is Darwin.",
    "note": "Same shape as SUMIF: where-to-look, what-to-look-for, what-to-average. AVERAGEIFS exists for multiple conditions."
  },
  {
    "cmd": "MAXIFS",
    "cat": "Conditional sums & counts",
    "syntax": "=MAXIFS(B2:B100,C2:C100,\"Darwin\")",
    "desc": "The largest number among rows that match a condition. Here: the highest amount in column B, but only for Darwin rows.",
    "note": "Numbers first (like SUMIFS), then condition pairs. MINIFS does the same for the smallest."
  },
  {
    "cmd": "MINIFS",
    "cat": "Conditional sums & counts",
    "syntax": "=MINIFS(B2:B100,C2:C100,\"Darwin\")",
    "desc": "The smallest number among rows that match a condition. Here: the lowest column B amount among Darwin rows.",
    "note": "The conditional version of MIN. Completes the SUMIFS/COUNTIFS/MAXIFS/MINIFS family."
  },
  {
    "cmd": "SUBTOTAL",
    "cat": "Conditional sums & counts",
    "syntax": "=SUBTOTAL(9,B2:B100)",
    "desc": "Aggregate a range while ignoring rows hidden by a filter. Here: sum column B, but only the rows currently showing.",
    "note": "<b>Solves a real trap:</b> a normal SUM counts filtered-out rows too. The first number is the operation: <b>9 = sum</b>, 1 = average, 2 = count, 4 = max, 5 = min. Use this whenever you sum a filtered list. (AGGREGATE is a more powerful modern cousin if you also need to skip errors.)"
  },
  {
    "cmd": "XLOOKUP",
    "cat": "Lookups",
    "syntax": "=XLOOKUP(F2,A2:A100,B2:B100)",
    "desc": "Find a value in one column and return the matching value from another. Here: look up the name in F2 within column A, and return its amount from column B.",
    "note": "Three parts: <b>what to find</b> (F2), <b>where to search</b> (A2:A100), <b>what to return</b> (B2:B100). The modern default lookup; cleaner and more flexible than VLOOKUP. By default it finds an exact match."
  },
  {
    "cmd": "XLOOKUP fallback",
    "cat": "Lookups",
    "syntax": "=XLOOKUP(F2,A2:A100,B2:B100,\"Not found\")",
    "desc": "An XLOOKUP that returns your own message when there's no match, instead of an error. Here: show 'Not found' if F2 isn't in column A.",
    "note": "The fourth argument is the if-not-found result. Cleaner than wrapping the whole thing in IFERROR, because it only catches a genuine no-match, not other errors."
  },
  {
    "cmd": "XLOOKUP approximate",
    "cat": "Lookups",
    "syntax": "=XLOOKUP(F2,A2:A100,B2:B100,,-1)",
    "desc": "Find the nearest match at or below a value, not just an exact one. Here: useful for tax brackets or grade bands where F2 falls between listed thresholds.",
    "note": "The fifth argument is match mode: <b>-1</b> = exact or next smaller, 1 = exact or next larger, 0 = exact only (default). The empty slot (,,) skips the not-found argument. This is where XLOOKUP shines over a plain VLOOKUP for banded lookups."
  },
  {
    "cmd": "VLOOKUP exact",
    "cat": "Lookups",
    "syntax": "=VLOOKUP(F2,A2:D100,3,FALSE)",
    "desc": "Find a value in the first column of a table and return a value from a column to its right. Here: find F2 in column A and return the 3rd column (C) of the A:D block.",
    "note": "Four parts: what to find, the table, <b>which column number</b> to return (counting from the left of the table), and <b>FALSE for an exact match</b>. <b>Why learn this AND XLOOKUP:</b> VLOOKUP is everywhere in existing spreadsheets, but it only looks rightward and breaks if someone inserts a column (the number 3 now points at the wrong place). XLOOKUP and INDEX/MATCH don't have that fragility. Teach VLOOKUP so students can read old sheets; teach XLOOKUP for new ones."
  },
  {
    "cmd": "VLOOKUP approximate",
    "cat": "Lookups",
    "syntax": "=VLOOKUP(F2,A2:B100,2,TRUE)",
    "desc": "A VLOOKUP that finds the nearest match at or below the value. Here: F2 falls into a band defined in column A, returns column B.",
    "note": "<b>The classic gotcha:</b> the last argument <b>TRUE</b> (or omitting it) means approximate match, and it <b>requires column A to be sorted ascending</b> or it returns nonsense. FALSE = exact, TRUE = banded. Most accidental VLOOKUP errors come from leaving this as TRUE by mistake."
  },
  {
    "cmd": "HLOOKUP",
    "cat": "Lookups",
    "syntax": "=HLOOKUP(F2,A1:Z2,2,FALSE)",
    "desc": "Like VLOOKUP but searches across a top row instead of down a column. Here: find F2 along row 1, return the value beneath it from row 2.",
    "note": "The 'H' is horizontal. Rare, because data is usually arranged in columns, but students meet it. XLOOKUP handles both directions, which is another reason it's the modern default."
  },
  {
    "cmd": "INDEX + MATCH",
    "cat": "Lookups",

/* Topics, in order of first appearance in the deck. Each -> list of deck indices. */
const TOPICS = (() => {
  const m = new Map();
  DECK.forEach((c, i) => {
    const k = c.cat || "General";
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(i);
  });
  return Array.from(m, ([name, idxs]) => ({ name, idxs }));
})();

/* ---- per-card progress, persisted across visits ----
   prog[cmd] = { r: "clean" | "retry", t: epoch-ms }
   "clean" = recalled first try last time; "retry" = needed another go. */
const PKEY = "syntax-crammer::" + SUBJECT;
function loadProg() { try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { return {}; } }
function saveProg(p) { try { localStorage.setItem(PKEY, JSON.stringify(p)); } catch (e) {} }
function recordResult(cmd, clean) {
  const p = loadProg();
  p[cmd] = { r: clean ? "clean" : "retry", t: Date.now() };
  saveProg(p);
}

/* one managed document-level Enter handler, so stale ones never stack up */
let enterHandler = null;
function onGlobalEnter(fn) {
  if (enterHandler) { document.removeEventListener('keydown', enterHandler); enterHandler = null; }
  if (!fn) return;
  enterHandler = (e) => {
    if (e.key !== "Enter") return;
    if (e.target.closest && e.target.closest("button, a, input, textarea, summary")) return;
    e.preventDefault(); fn();
  };
  document.addEventListener('keydown', enterHandler);
}

/* ---- matching ---- */
function normalise(s) {
  if (MATCH_MODE === "strict") return s;
  // forgiving: unify quotes, collapse whitespace, and ignore the optional spaces
  // formula languages allow around brackets, commas and operators, so
  // "= SUMIF( A, B )" matches "=SUMIF(A,B)". Crucially, spaces *inside* a quoted
  // string are preserved, because there a space can be the answer (e.g. the
  // ", " delimiter in TEXTJOIN).
  let s2 = s
    .replace(/\r\n/g, "\n")
    .replace(/[‘’]/g, "'")          // curly single quotes -> straight
    .replace(/[“”]/g, '"')          // curly double quotes -> straight
    .replace(/[ \t]+/g, " ")
    .trim()
    .replace(/;+\s*$/g, "");                   // ignore a trailing semicolon
  // Split on quoted runs ("..." or '...'); only tidy the parts OUTSIDE quotes.
  const parts = s2.split(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {  // even indices are the unquoted segments
      parts[i] = parts[i].replace(/\s*([(),=+\-*/<>!&\[\]{}:;])\s*/g, "$1");
    }
    // odd indices are quoted strings: left exactly as typed
  }
  return parts.join("");
}
function isMatch(typed, target) { return normalise(typed) === normalise(target); }

/* ---- session ---- */
function startSession(topicName) {
  onGlobalEnter(null);
  scopeTopic = topicName;
  queue = topicName === null
    ? DECK.map((_, i) => i)
    : (TOPICS.find(t => t.name === topicName) || { idxs: [] }).idxs.slice();
  if (!queue.length) { renderStart(); return; }
  sessionTotal = queue.length;
  learnedSet = new Set(); attempts = 0; hits = 0; missCount = {};
  stripwrap.style.visibility = "visible";
  tbHome.classList.remove('hide');
  nextCard();
}
function nextCard() {
  if (queue.length === 0) { renderSummary(); return; }
  card = { ...DECK[queue[0]], _idx: queue[0] };
  stage = "learn"; renderCard(); updateStrip();
}
function updateStrip() {
  const learned = learnedSet.size;
  stripfill.style.width = (learned / sessionTotal * 100) + "%";
  stripleft.textContent = (scopeTopic === null ? "full deck" : scopeTopic) + " · queue: " + queue.length;
  stripright.textContent = learned + " / " + sessionTotal + " learned";
}
function topicPill() {
  return card.cat ? ` <span class="pill topic">${escapeHtml(card.cat)}</span>` : "";
}
function renderCard() {
  if (stage === "learn") return renderLearn();
  return renderType(stage === "copy" ? "copy" : "recall");
}

  const go = document.getElementById('go');

    <div class="eyebrow">${isCopy ? "Copy" : "Recall"} <span class="pill">${escapeHtml(card.cmd)}</span>${topicPill()}</div>
    <p class="desc">${card.desc}</p>
    ${isCopy ? `<div class="label" style="margin-top:16px">Type this exactly</div><div class="target" id="target">${escapeHtml(card.syntax)}</div>`
             : `<p class="note" style="margin-top:8px">From memory.</p>`}
    <div class="promptline">
      <div class="ps ${MULTILINE ? 'multiline' : ''}" id="psline">
        <span class="sigil"></span>
        ${field}
      </div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="row">
      <button class="primary" id="check">Check &nbsp;&crarr;</button>
      ${isCopy ? "" : `<button class="ghost" id="reveal">Show answer</button>`}
      <div class="spacer"></div>
      <span class="small">${isCopy ? "Live-matched against the target." : (MATCH_MODE === "strict" ? "Strict match." : "Forgiving match.")}</span>
    </div>`;
  const entry = document.getElementById('entry');
  const psline = document.getElementById('psline');
  const fb = document.getElementById('fb');
  const targetEl = document.getElementById('target');
  entry.focus();
  if (isCopy && targetEl) entry.addEventListener('input', () => paintTarget(targetEl, card.syntax, entry.value));

  function attempt() {
    if (isMatch(entry.value, card.syntax)) {
      psline.classList.remove('wrong'); psline.classList.add('correct');
      fb.className = "feedback ok";
      fb.textContent = isCopy ? "Matched. Now the real test." : "Correct. Locked in.";
      if (!isCopy) { hits++; attempts++; recordResult(card.cmd, !missCount[card.cmd]); }
      setTimeout(() => {
        if (isCopy) { stage = "recall"; renderCard(); }
        else { learnedSet.add(card.cmd); dropCard(); nextCard(); }
      }, 480);
    } else {
      psline.classList.remove('correct'); psline.classList.add('wrong');
      fb.className = "feedback bad";
      if (isCopy) {
        fb.textContent = "Not quite, the highlight shows where it differs.";
        if (targetEl) paintTarget(targetEl, card.syntax, entry.value);
      } else {
        attempts++; missCount[card.cmd] = (missCount[card.cmd] || 0) + 1;
        fb.innerHTML = "Missed. This card will come back. Try again, or reveal.";
        requeueCurrent();
        entry.select();
      }
    }
  }
  document.getElementById('check').onclick = attempt;
  entry.addEventListener('keydown', (e) => {
    if (e.key === "Enter" && (!MULTILINE || e.ctrlKey || e.metaKey)) { e.preventDefault(); attempt(); }
  });
  if (!isCopy) document.getElementById('reveal').onclick = () => {
    fb.className = "feedback bad";
    fb.innerHTML = "Answer: <b>" + escapeHtml(card.syntax) + "</b> &nbsp;(card requeued)";
    missCount[card.cmd] = (missCount[card.cmd] || 0) + 1; requeueCurrent();
    entry.value = ""; entry.focus();
  };
}
function requeueCurrent() {
  const idx = queue.shift();
  const insertAt = Math.min(queue.length, 3 + Math.floor(Math.random() * 3));
  queue.splice(insertAt, 0, idx); updateStrip();
}
function dropCard() { queue.shift(); updateStrip(); }
function paintTarget(el, target, typed) {
  let html = "", diverged = false;
  for (let i = 0; i < target.length; i++) {
    const ch = escapeHtml(target[i]);
    if (!diverged && i < typed.length && typed[i] === target[i]) html += "<span class='hit'>" + ch + "</span>";
    else if (!diverged && i < typed.length && typed[i] !== target[i]) { html += "<span class='miss'>" + ch + "</span>"; diverged = true; }
    else html += ch;
  }
  el.innerHTML = html;
}
function renderSummary() {
  stripwrap.style.visibility = "hidden";
  tbHome.classList.add('hide');
  const accuracy = attempts ? Math.round(hits / attempts * 100) : 0;
  const tough = Object.entries(missCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const scopeWord = scopeTopic === null ? "deck" : `<b>${escapeHtml(scopeTopic)}</b> topic`;
  consoleEl.innerHTML = `
    <div class="center">
      <h1 class="brand"><span class="gt">&gt;_</span> ${scopeTopic === null ? "Deck" : "Topic"} cleared</h1>
      <p class="tagline">${learnedSet.size} of ${sessionTotal} ${scopeWord} cards recalled from memory.</p>
      <div class="summary-grid">
        <div><div class="v" style="color:var(--ok)">${learnedSet.size}</div><div class="k">learned</div></div>
        <div><div class="v">${attempts}</div><div class="k">recall attempts</div></div>
        <div><div class="v" style="color:${accuracy >= 80 ? 'var(--ok)' : 'var(--caret)'}">${accuracy}%</div><div class="k">first-try rate</div></div>
      </div>
      ${tough.length ? `<div class="label" style="margin-top:18px">Worth another look</div>
        <div class="toughlist">${tough.map(([c, n]) => `<div class="ti"><code>${escapeHtml(c)}</code> &mdash; missed ${n} time${n > 1 ? 's' : ''}</div>`).join("")}</div>`
        : `<p class="note center" style="margin-top:16px">Clean run, nothing tripped you up.</p>`}
    </div>
    <div class="row center" style="justify-content:center; margin-top:24px">
      <button class="primary" id="again">Run it again</button>
      <button class="ghost" id="toughonly" ${tough.length ? '' : 'disabled'}>Drill just the missed ones</button>
      <button class="ghost" id="home">Contents</button>
    </div>`;
  document.getElementById('again').onclick = () => startSession(scopeTopic);
  document.getElementById('home').onclick = renderStart;
  document.getElementById('toughonly').onclick = () => {
    const t = new Set(tough.map(x => x[0]));
    queue = DECK.map((_, i) => i).filter(i => t.has(DECK[i].cmd));
    if (!queue.length) { startSession(scopeTopic); return; }
    sessionTotal = queue.length;
    learnedSet = new Set(); attempts = 0; hits = 0; missCount = {};
    stripwrap.style.visibility = "visible"; tbHome.classList.remove('hide');
    nextCard();
  };
  document.getElementById('again').focus({ preventScroll: true });
}
function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* favicon: subject initial on the theme accent, so browser tabs are tellable apart */
(function () {
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim() || "#888";
  const deep = css.getPropertyValue('--bg-deep').trim() || "#000";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="13" fill="${accent}"/><text x="32" y="45" font-size="38" font-family="monospace" font-weight="bold" text-anchor="middle" fill="${deep}">${escapeHtml(SUBJECT[0] || "?")}</text></svg>`;
  const link = document.createElement('link');
  link.rel = "icon";
  link.href = "data:image/svg+xml," + encodeURIComponent(svg);
  document.head.appendChild(link);
})();

renderStart();
</script>
</body>
</html>
