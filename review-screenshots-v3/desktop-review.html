<h1>Section hero desktop review</h1><div id="mount"></div><script>
const pages=[['Home','/'],['Library','/library/'],['Simulation Tools','/simulations/'],['Full Course List','/courses/']];const sizes=[[1920,1080,.5],[1280,720,.75]];const mount=document.querySelector('#mount');pages.forEach(([name,url],i)=>{const section=document.createElement('section');section.className='case';section.id='case-'+i;section.innerHTML='<h2>'+name+'</h2>';sizes.forEach(([w,h,scale])=>{const box=document.createElement('div');box.className='frame';box.innerHTML='<b>'+w+' × '+h+'</b><span class="status">checking…</span><div class="viewport w'+w+'"><iframe title="'+name+' at '+w+' by '+h+'" width="'+w+'" height="'+h+'" src="'+url+'?desktop-review='+w+'&rev=1"></iframe></div>';const frame=box.querySelector('iframe');frame.addEventListener('load',()=>{const win=frame.contentWindow,doc=frame.contentDocument.documentElement;const ok=Math.ceil(doc.scrollWidth)<=Math.ceil(win.innerWidth);box.querySelector('.status').textContent='inner '+win.innerWidth+' · scroll '+doc.scrollWidth+' · '+(ok?'NO HORIZONTAL OVERFLOW':'OVERFLOW');box.querySelector('.status').style.color=ok?'#46d3d2':'#ff6767';});section.append(box)});mount.append(section)});
